resources:
  jobs:
    match_ingestion:
        name: match_ingestion

        tasks:
            
          - task_key: fetch_matches
            spark_python_task:
              python_file: ../src/ingestion/match.py
            environment_key: default

        environments:
          - environment_key: default
            spec:
              environment_version: "2"
              dependencies:
              - "databricks-sdk"
              - "requests"

        schedule:
          quartz_cron_expression: "0 0 2 * * ?"
          timezone_id: "Asia/Singapore"
          pause_status: PAUSED