resources:
  jobs:
    riot_ingestion:
      name: riot_ingestion

      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: ../src/transformation/bronze.py
          environment_key: default

        - task_key: silver
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: ../src/transformation/silver.py
          environment_key: default

        - task_key: gold
          depends_on:
            - task_key: silver

          sql_task:
            file:
              path: ../src/transformation/gold.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"