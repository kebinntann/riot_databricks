resources:
  jobs:
    match_pipeline:
        name: match_pipeline

        tasks:
            
          - task_key: bronze
            spark_python_task:
              python_file: ../src/transformation/match_pipeline/bronze.py
            environment_key: default

          - task_key: silver
            depends_on:
              - task_key: bronze
            spark_python_task:
              python_file: ../src/transformation/match_pipeline/silver.py
            environment_key: default

        environments:
          - environment_key: default
            spec:
              environment_version: "2"

        
